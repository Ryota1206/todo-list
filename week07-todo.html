<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TODOリスト</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>
    <body class="bg-orange-200 flex items-center justify-center min-h-screen p-4 ">
        <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6">todoist</h1>
            <div class="flex gap-2 mb-6">
                <input id="todoInput" type="text" placeholder="タスクを入力"
                class="flex-1 border border-gray-300 rounded px-3 py-2">
                <button id="addBtn"
                class="bg-blue-600 text-white font-bold px-4 py-2 rounded hover:bg-blue-700 transition">
                追加
            </button>
            </div>
            <ul id="todoList" class="space-y-2"></ul>
        </div>
        <div id="messageBox" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-orange-300
text-white px-4 py-2 rounded shadow text-center hidden">
</div>
<script>
    const addButton = document.querySelector("#addBtn");
    const todoInput = document.querySelector("#todoInput");
    const todoList = document.querySelector("#todoList");
    const messageBox = document.querySelector("#messageBox");

    const messages = [
        "よく頑張ったね！",
        "えらい！",
        "その調子！",
        "一歩前進したね！",
        "今日も進んでるよ！",
        "素晴らしい！",
        "継続できてるね！"
    ];

    todoInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            addButton.click();
        }
    });

    addButton.addEventListener("click", () => {
        const text = todoInput.value;
        if (text === "") return;

        const item = document.createElement("li");
        item.className = "flex items-center justify-between bg-gray-50 rounded px-3 py-2";

        const span = document.createElement("span");
        span.textContent = text;

        const doneBtn = document.createElement("button");
        doneBtn.textContent = "完了";
        doneBtn.className = "text-sm text-gray-500 hover:text-red-500";

        doneBtn.addEventListener("click", () => {
            span.classList.toggle("line-through");
            span.classList.toggle("text-gray-400");

            if (span.classList.contains("line-through")) {
                const randomIndex = Math.floor(Math.random() * messages.length);
                const message = messages[randomIndex];

                messageBox.textContent = message;
                messageBox.classList.remove("hidden");

                setTimeout(() => {
                    messageBox.classList.add("hidden");
                }, 2000);
            }
        });

        item.appendChild(span);
        item.appendChild(doneBtn);
        todoList.appendChild(item);

        todoInput.value = "";
    });
</script>
    </body>
    </html>
